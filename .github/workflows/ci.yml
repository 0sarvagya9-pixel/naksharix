name: CI

on:
  push:
    branches: [main, complete-production-polish]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: naksharix
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/naksharix?schema=public
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ASTROLOGY_PROVIDER: own_engine
      AI_ASTROLOGER_ENABLED: "false"
      ALLOW_AI_DIAGNOSTICS: "false"
      EMAIL_PROVIDER: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run qa:release
      - run: node scripts/qa-csrf-coverage.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --check
      - name: Audit production dependencies for critical vulnerabilities
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=critical
