name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: naksharix
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Enforce independent encrypted backup and restore contracts
        run: node scripts/qa-independent-recovery-workflows.mjs
      - name: Validate owner-local secret bridge (no credentials used)
        run: node scripts/qa-owner-backup-secret-bridge.mjs
      - name: Parse owner-local PowerShell script without executing it
        shell: pwsh
        run: |
          $tokens=$null; $parseErrors=$null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/ops/setup-readonly-github-backup.ps1",[ref]$tokens,[ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Output "POWERSHELL_SECRET_BRIDGE_SYNTAX=PASS"
      - name: Verify Neon CLI install stdout isolation (mocked)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/qa-neon-cli-path.ps1
      - name: Validate safe Chrome Neon OAuth redirect (mocked, no credentials)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/qa-chrome-neon-oauth.ps1
      - run: npm install
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/naksharix?schema=public
      - run: npm run typecheck
      - run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/naksharix?schema=public
          JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
