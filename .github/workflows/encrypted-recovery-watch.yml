name: NAKSHARIX Verified Encrypted Recovery Watch

# Scheduled workflows run on default main, then check the authoritative
# production encrypted/private backup and isolated restore receipt.
# No production data, access keys, or private backup bytes are downloaded.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: naksharix-encrypted-recovery-watch
  cancel-in-progress: false

jobs:
  verify-encrypted-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: complete-production-polish
          show-progress: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual encrypted private archive and isolated restore receipt
        id: check
        continue-on-error: true
        run: node scripts/ops/check-encrypted-recovery.mjs
      - name: Alert on missing receipts; close issue only after actual verified restore
        if: always() && steps.check.outcome != 'skipped'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RECOVERY_RESULT: ${{ steps.check.outcome }}
        run: |
          set -euo pipefail
          incident_title='[backup] NAKSHARIX encrypted backup job failed'
          issue_number=$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title == "[backup] NAKSHARIX encrypted backup job failed") | .number' | head -n 1)
          if [ "$RECOVERY_RESULT" = "success" ]; then
            if [ -n "$issue_number" ]; then
              gh issue comment "$issue_number" --body 'Fresh private encrypted archive and independently restored database receipt were verified by the live production endpoint. No backup bytes were exposed by the watcher.'
              gh issue close "$issue_number" --reason completed
            fi
          elif [ -z "$issue_number" ]; then
            gh issue create --title "$incident_title" \
              --body 'NAKSHARIX production encrypted database recovery is unverified or stale. Inspect the /api/ops/backup-status endpoint, production Vercel Cron, and owner backup failure alerts. A Neon branch or a successful CI fixture does not replace a fresh encrypted private archive and isolated restore receipt. Do not share passwords or customer data.'
          fi
      - name: Fail closed until a fresh encrypted restore receipt exists
        if: always() && steps.check.outcome == 'failure'
        run: exit 1
