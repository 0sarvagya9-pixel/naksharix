name: Final Cleanup Once

on:
  push:
    branches:
      - feat/final-28-code-closure-20260729
    paths:
      - .github/workflows/final-cleanup-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/final-28-code-closure-20260729
          fetch-depth: 0

      - name: Align permanent database rehearsal with guarded restore drill
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/database-baseline-rehearsal.yml <<'YAML'
          name: Database Baseline Rehearsal

          on:
            pull_request:
              paths:
                - prisma/schema.prisma
                - package.json
                - package-lock.json
                - scripts/qa-disposable-db-rehearsal.sh
                - .github/workflows/database-baseline-rehearsal.yml
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            rehearse-baseline:
              runs-on: ubuntu-latest
              timeout-minutes: 25
              services:
                postgres:
                  image: postgres:16-alpine
                  env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: naksharix_baseline_rehearsal
                  ports:
                    - 5432:5432
                  options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
              env:
                DATABASE_URL: postgresql://postgres:postgres@localhost:5432/naksharix_baseline_rehearsal?schema=public
                DIRECT_URL: postgresql://postgres:postgres@localhost:5432/naksharix_baseline_rehearsal?schema=public
                PSQL_URL: postgresql://postgres:postgres@localhost:5432/naksharix_baseline_rehearsal
                POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
                RESTORE_URL: postgresql://postgres:postgres@localhost:5432/naksharix_restore_rehearsal
              steps:
                - uses: actions/checkout@v4
                  with:
                    show-progress: false

                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm

                - name: Install locked dependencies
                  run: npm ci

                - name: Run guarded disposable schema backup and restore rehearsal
                  shell: bash
                  run: bash scripts/qa-disposable-db-rehearsal.sh database-baseline-evidence

                - name: Run database-sensitive static QA
                  run: |
                    npm run qa:reports-workflow
                    npm run qa:payments
                    npm run qa:storage
                    npm run qa:audit-security
                    npm run qa:final-closure

                - name: Upload database rehearsal evidence
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: database-baseline-rehearsal-${{ github.sha }}
                    path: database-baseline-evidence
                    if-no-files-found: error
                    retention-days: 30
          YAML

      - name: Remove temporary diagnostics and this one-shot writer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/gate4-diagnostic.yml
          rm -f diagnostics/gate4-latest.txt
          rmdir diagnostics 2>/dev/null || true
          rm -f .github/workflows/final-cleanup-once.yml

      - name: Commit final clean branch state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to clean."
            exit 0
          fi
          git commit -m "chore(final): align DB rehearsal and remove diagnostics"
          git push origin HEAD:feat/final-28-code-closure-20260729
