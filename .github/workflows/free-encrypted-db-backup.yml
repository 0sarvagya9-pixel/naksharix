name: NAKSHARIX Encrypted Recovery Watch

# Production-owned Vercel cron performs read-only export, AES-GCM private upload,
# download verification and isolated restore. This independent job verifies its
# fresh receipt; configuration alone never qualifies as a successful backup.
on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/free-encrypted-db-backup.yml']
permissions:
  contents: read
concurrency:
  group: naksharix-free-db-backup
  cancel-in-progress: false
jobs:
  verified-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require a fresh encrypted and independently restored archive
        id: recovery
        continue-on-error: true
        shell: bash
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          let verified=false;
          for(let attempt=0;attempt<3;attempt++) {
            try {
              const response=await fetch('https://www.naksharix.com/api/ops/backup-status',{
                cache:'no-store',redirect:'error',signal:AbortSignal.timeout(20000)
              });
              assert.equal(response.status,200);
              const {data}=await response.json();
              assert.equal(data.configured,true);
              assert.equal(data.operational,true);
              assert.equal(data.encrypted,true);
              assert.equal(data.restoreVerified,true);
              const age=Date.now()-Date.parse(data.lastSuccessfulAt);
              assert.ok(Number.isFinite(age)&&age>=-300000&&age<36*3600000);
              console.log('ENCRYPTED_RECOVERY=PASS;RESTORE=VERIFIED;FRESHNESS_LT_36H=YES');
              console.log('LAST_VERIFIED_AT='+data.lastSuccessfulAt);
              verified=true;break;
            } catch {
              if(attempt<2)await new Promise(resolve=>setTimeout(resolve,10000));
            }
          }
          if(!verified){console.error('ENCRYPTED_RECOVERY=FAIL;NO_FRESH_VERIFIED_RECEIPT');process.exitCode=1;}
          JS
      - name: Open one incident or close only after verified recovery
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHECK_RESULT: ${{ steps.recovery.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          title='[backup] NAKSHARIX encrypted backup job failed'
          incident=$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "[backup] NAKSHARIX encrypted backup job failed") | .number' | head -n 1)
          if [ "$CHECK_RESULT" = success ]; then
            if [ -n "$incident" ]; then
              gh issue comment "$incident" --body 'Verified a fresh production recovery receipt: read-only PostgreSQL export, private AES-256-GCM archive, downloaded ciphertext validation and successful isolated restore. The deployment-owned daily job retains seven days of archives. This independent checker has no database credentials or decryption keys.'
              gh issue close "$incident" --reason completed
            fi
          elif [ -n "$incident" ]; then
            gh issue comment "$incident" --body 'No fresh verified encrypted recovery receipt was available after three checks. Inspect production recovery status and protected configuration. Do not publish database credentials, keys or customer data.'
          else
            gh issue create --title "$title" --body 'The scheduled recovery monitor could not verify an encrypted archive and isolated restore within 36 hours. Configuration or an in-provider recovery branch is not sufficient. Inspect the deployment-owned daily recovery job; preserve existing archives and the offline key.'
          fi
      - name: Fail closed on stale or missing recovery evidence
        if: always() && steps.recovery.outcome != 'success'
        run: exit 1
