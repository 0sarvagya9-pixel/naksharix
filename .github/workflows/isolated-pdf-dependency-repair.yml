name: Isolated PDF Dependency Lock Repair

on:
  push:
    branches: [feat/preserve-live-ui-on-production-20260729]
    paths: [.github/workflows/isolated-pdf-dependency-repair.yml]

permissions:
  contents: write

jobs:
  pdf-dependency-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Guard isolated branch and clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'feat/preserve-live-ui-on-production-20260729'
          test -f package-lock.json
          test -z "$(git status --porcelain)"
      - name: Resolve and audit exact PDF libraries
        shell: bash
        run: |
          set -euo pipefail
          npm install pdf-lib@1.17.1 @pdf-lib/fontkit@1.1.1 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          for (const [name, version] of [['pdf-lib','1.17.1'],['@pdf-lib/fontkit','1.1.1']]) {
            if (pkg.dependencies[name] !== version) throw new Error('Unexpected dependency: '+name);
            if (lock.packages['node_modules/'+name]?.version !== version) throw new Error('Unexpected lock: '+name);
          }
          console.log('PDF_DEPENDENCIES=2/2_PINNED');
          NODE
      - name: Commit only reviewed manifests
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          while IFS= read -r changed; do
            case "$changed" in package.json|package-lock.json) ;; *) echo "UNEXPECTED_CHANGE=$changed"; exit 1;; esac
          done < <(git diff --name-only)
          git add package.json package-lock.json
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git config user.name 'naksharix-safe-dependency-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(reports): lock pdf-lib and unicode fontkit renderer'
          git push origin "HEAD:${GITHUB_REF_NAME}"
