name: One-time dependency lockfile refresh
on:
  push:
    branches: [fix/nonpayment-security-deps-20261026]
    paths: [.github/workflows/lockfile-refresh.yml]
permissions:
  contents: write
jobs:
  regenerate-lockfile:
    if: github.repository == '0sarvagya9-pixel/naksharix' && github.ref == 'refs/heads/fix/nonpayment-security-deps-20261026'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate consistent locked dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate lock install and audit on disposable runner
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --omit=dev --audit-level=high
      - name: Commit only the audited lockfile and remove this one-time workflow
        run: |
          set -euo pipefail
          git config user.name "naksharix-dependency-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/lockfile-refresh.yml
          git add package-lock.json package.json
          git diff --cached --check
          git commit -m "security(deps): regenerate verified lockfile and retire temporary workflow"
          git push origin HEAD:fix/nonpayment-security-deps-20261026
