name: NAKSHARIX Android Lockfile Sync
on:
  push:
    branches: [feat/naksharix-native-android-v2-20261110]
    paths:
      - mobile-app/package.json
      - .github/workflows/mobile-lock-sync.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: naksharix-mobile-lockfile
  cancel-in-progress: false
jobs:
  sync-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/naksharix-native-android-v2-20261110
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve Expo SecureStore and npm lockfile
        working-directory: mobile-app
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit reproducible mobile lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- mobile-app/package-lock.json; then
            echo MOBILE_LOCK_ALREADY_SYNCED=PASS
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-app/package-lock.json
          git commit -m "chore(android): lock Expo SecureStore dependency"
          git push origin HEAD:feat/naksharix-native-android-v2-20261110
          echo MOBILE_LOCK_SYNCED=PASS
