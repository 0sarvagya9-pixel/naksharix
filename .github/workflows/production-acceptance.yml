name: Production Acceptance

# Deploy approval is separate from GitHub source merges.
# Run this workflow manually against the exact deployed release branch/commit only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://www.naksharix.com
      APEX_URL: https://naksharix.com
      WWW_URL: https://www.naksharix.com
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Prepare evidence directory
        run: mkdir -p production-evidence

      - name: Wait for the exact release deployment
        shell: bash
        run: |
          set -euo pipefail
          matched=0
          for attempt in {1..24}; do
            echo "Release identity attempt ${attempt}/24"
            if curl --silent --show-error --fail --location --connect-timeout 10 --max-time 30 \
              "${BASE_URL}/api/release" -o production-evidence/release.json; then
              cat production-evidence/release.json
              if node -e '
                const fs = require("fs");
                const body = JSON.parse(fs.readFileSync("production-evidence/release.json", "utf8"));
                const actual = body?.data?.commitSha;
                const expected = process.env.EXPECTED_SHA;
                if (!actual || actual !== expected) process.exit(1);
              '; then
                matched=1
                break
              fi
            fi
            sleep 15
          done
          if [ "$matched" -ne 1 ]; then
            echo "Custom domain did not expose expected release SHA ${EXPECTED_SHA}." >&2
            exit 1
          fi

      - name: Verify canonical hosts TLS and security headers
        shell: bash
        run: |
          set -euo pipefail
          apex_effective=$(curl --silent --show-error --fail --location --connect-timeout 10 --max-time 30 \
            --dump-header production-evidence/apex-headers.txt \
            --output production-evidence/apex.html \
            --write-out '%{url_effective}' \
            "${APEX_URL}/")
          www_effective=$(curl --silent --show-error --fail --location --connect-timeout 10 --max-time 30 \
            --dump-header production-evidence/www-headers.txt \
            --output production-evidence/www.html \
            --write-out '%{url_effective}' \
            "${WWW_URL}/")
          printf 'apex_effective=%s\nwww_effective=%s\n' "$apex_effective" "$www_effective" > production-evidence/canonical.txt
          [ "$apex_effective" = "${WWW_URL}/" ] || { echo "Apex did not redirect to canonical www host" >&2; exit 1; }
          [ "$www_effective" = "${WWW_URL}/" ] || { echo "www host unexpectedly redirected" >&2; exit 1; }
          grep -Eq 'rel="canonical"[^>]+href="https://www\.naksharix\.com/?"' production-evidence/www.html || { echo "Homepage canonical is not www" >&2; exit 1; }
          grep -qi '^x-frame-options: DENY' production-evidence/apex-headers.txt
          grep -qi '^x-content-type-options: nosniff' production-evidence/apex-headers.txt
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' production-evidence/apex-headers.txt

      - name: Verify health and production database connectivity
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location --connect-timeout 10 --max-time 30 \
            "${BASE_URL}/api/health" -o production-evidence/health.json
          cat production-evidence/health.json
          node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync("production-evidence/health.json", "utf8"));
            const data = body?.data ?? body;
            if (data?.status !== "ok") throw new Error(`health status is ${data?.status}`);
            if (data?.checks?.database !== "ok") throw new Error(`database status is ${data?.checks?.database}`);
            if (data?.checks?.redis === "error") throw new Error("redis status is error");
          '

      - name: Verify production capability truth and SMTP readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location --connect-timeout 10 --max-time 30 \
            "${BASE_URL}/api/ops/readiness" -o production-evidence/readiness.json
          cat production-evidence/readiness.json
          node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync("production-evidence/readiness.json", "utf8"));
            const data = body?.data ?? body;
            if (data?.services?.email?.provider !== "smtp" || data?.services?.email?.enabled !== true) throw new Error("SMTP email readiness is not active");
            if (data?.services?.databaseSchema?.ready !== true || data?.services?.databaseSchema?.missingCount !== 0) throw new Error("Release held: learning/puja tables or indexes missing");
            if (data?.capabilities?.subscriptionsEnabled !== false) throw new Error("Subscriptions unexpectedly active");
            if (data?.capabilities?.aiReportGeneratorEnabled !== false) throw new Error("AI report generator unexpectedly active");
            if (data?.capabilities?.shopMode !== "market_priced_unpaid_order_requests") throw new Error("Shop unpaid order scope changed");
            if (data?.privacy?.analyticsQueryStringExcluded !== true) throw new Error("Analytics privacy marker missing");
          '

      - name: Verify AI Astrologer activation and readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location --connect-timeout 10 --max-time 30 \
            "${BASE_URL}/api/ai/status" -o production-evidence/ai-status.json
          cat production-evidence/ai-status.json
          node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync("production-evidence/ai-status.json", "utf8"));
            const data = body?.data ?? body;
            if (data?.enabled !== true) throw new Error("AI_ASTROLOGER_ENABLED is not active");
            if (data?.ready !== true) throw new Error("Gemini key/readiness is not active");
          '
          curl --silent --show-error --fail --location --connect-timeout 10 --max-time 30 \
            "${BASE_URL}/ai-astrologer" -o production-evidence/ai-page.html
          grep -qi 'AI Astrologer' production-evidence/ai-page.html
          if grep -qi 'Temporarily Unavailable' production-evidence/ai-page.html; then
            echo "AI page is still rendering the unavailable state." >&2
            exit 1
          fi

      - name: Verify active public product routes
        shell: bash
        run: |
          set -euo pipefail
          for route in shop reports consultation pricing signup login verify-email learn pujas puja-calendar cart; do
            curl --silent --show-error --fail --location --connect-timeout 10 --max-time 30 \
              "${BASE_URL}/${route}" -o "production-evidence/${route}.html"
          done
          grep -qi 'Spiritual Catalogue' production-evidence/shop.html
          grep -Eqi 'Add to cart' production-evidence/shop.html
          if grep -Eqi 'Pay with Razorpay|Buy Now|Complete payment' production-evidence/shop.html; then
            echo "Unapproved Shop payment control is visible." >&2
            exit 1
          fi
          grep -qi 'Services and Pricing' production-evidence/pricing.html

      - name: Verify robots and sitemap feature truth
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location --connect-timeout 10 --max-time 30 \
            "${BASE_URL}/robots.txt" -o production-evidence/robots.txt
          curl --silent --show-error --fail --location --connect-timeout 10 --max-time 30 \
            "${BASE_URL}/sitemap.xml" -o production-evidence/sitemap.xml
          grep -q '/shop' production-evidence/sitemap.xml
          grep -q '/consultation' production-evidence/sitemap.xml
          grep -q 'https://www.naksharix.com/sitemap.xml' production-evidence/robots.txt
          grep -q '<loc>https://www.naksharix.com' production-evidence/sitemap.xml
          if grep -Eq '<loc>https://naksharix.com' production-evidence/sitemap.xml; then
            echo "Redirecting apex host leaked to sitemap." >&2
            exit 1
          fi
          for private in commerce-enquiry ask-astrologer puja-enquiry; do
            if grep -Fq "<loc>https://www.naksharix.com/${private}</loc>" production-evidence/sitemap.xml; then
              echo "Private enquiry in sitemap: ${private}" >&2
              exit 1
            fi
          done
          for locale in mr bn es fr; do
            if grep -Fq "<loc>https://www.naksharix.com/${locale}/learn/kundli-explained</loc>" production-evidence/sitemap.xml; then
              echo "Unreviewed translation in sitemap: ${locale}" >&2
              exit 1
            fi
          done
          node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync("production-evidence/ai-status.json", "utf8"));
            const data = body?.data ?? body;
            const sitemap = fs.readFileSync("production-evidence/sitemap.xml", "utf8");
            const hasAi = sitemap.includes("<loc>https://www.naksharix.com/ai-astrologer</loc>");
            if (Boolean(data?.ready) !== hasAi) throw new Error("AI readiness/sitemap mismatch");
          '

      - name: Summarize production acceptance
        run: |
          {
            echo "expected_sha=${EXPECTED_SHA}"
            echo "base_url=${BASE_URL}"
            echo "release_identity=PASS"
            echo "canonical_hosts_tls=PASS"
            echo "health_database=PASS"
            echo "ops_email_scope=PASS"
            echo "ai_enabled_ready=PASS"
            echo "public_routes=PASS"
            echo "robots_sitemap=PASS"
            echo "unreviewed_locales_noindex=SOURCE_GATE_ACTIVE"
            echo "search_console_indexing=EXTERNAL_NOT_YET_VERIFIED"
          } | tee production-evidence/summary.txt

      - name: Upload production acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-acceptance-${{ github.sha }}
          path: production-evidence
          if-no-files-found: warn
          retention-days: 30
