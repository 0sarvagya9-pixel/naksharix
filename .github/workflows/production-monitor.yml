name: Production Monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: naksharix-production-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://www.naksharix.com
    steps:
      - name: Check public production endpoints
        id: checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p monitor-evidence
          failed=0

          check() {
            local name="$1"
            local path="$2"
            local expected="$3"
            local out="monitor-evidence/${name}.txt"
            code=$(curl --silent --show-error --location --max-time 20 --output "$out" --write-out "%{http_code}" "${BASE_URL}${path}" || true)
            echo "${name} HTTP ${code}" | tee -a monitor-evidence/summary.txt
            if [ "$code" != "$expected" ]; then
              failed=1
            fi
          }

          check health /api/health 200
          check release /api/release 200
          check readiness /api/ops/readiness 200
          check robots /robots.txt 200
          check sitemap /sitemap.xml 200

          node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('monitor-evidence/health.txt', 'utf8'));
          const payload = health.data ?? health;
          if (payload.status !== 'ok' || payload.checks?.database !== 'ok' || payload.checks?.redis === 'error') {
            console.error('Health payload is degraded', payload);
            process.exit(1);
          }
          const readiness = JSON.parse(fs.readFileSync('monitor-evidence/readiness.txt', 'utf8'));
          const data = readiness.data ?? readiness;
          if (data.capabilities?.subscriptionsEnabled !== false) throw new Error('Subscriptions unexpectedly enabled');
          if (data.capabilities?.aiReportGeneratorEnabled !== false) throw new Error('AI report generator unexpectedly enabled');
          if (data.capabilities?.shopMode !== 'informational_enquiry_only') throw new Error('Shop mode changed');
          NODE

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Upload monitor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-monitor-${{ github.run_id }}
          path: monitor-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Open or update production incident
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Production Monitor] Naksharix production check failed';
            const body = `Automated production monitoring failed at ${new Date().toISOString()}\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nNo secrets are included in this issue. Review the uploaded monitor evidence and production logs.`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'production-monitor'
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['production-monitor'] });
            }
