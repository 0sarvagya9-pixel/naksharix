name: Security Dependency Remediation

on:
  pull_request:
    branches:
      - complete-production-polish

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/final-28-code-closure-20260729'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Inspect dependency state
        id: state
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          const safe = p.dependencies?.next === '15.5.22'
            && p.dependencies?.['next-auth'] === '5.0.0-beta.32'
            && p.dependencies?.['@auth/prisma-adapter'] === '2.11.3'
            && !p.dependencies?.nodemailer
            && p.dependencies?.sharp === '0.35.3'
            && p.dependencies?.ws === '8.21.1'
            && p.devDependencies?.postcss === '8.5.23'
            && !p.optionalDependencies?.swisseph
            && !p.devDependencies?.['@types/nodemailer']
            && p.overrides?.nodemailer === '9.0.3'
            && p.overrides?.sharp === '$sharp'
            && p.overrides?.postcss === '$postcss';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `safe=${safe ? 'true' : 'false'}\n`);
          NODE

      - name: Confirm Auth.js runtime usage and Resend-native email transport
        shell: bash
        run: |
          set -euo pipefail
          git grep -q 'NextAuth(' -- auth.ts
          git grep -q '@auth/prisma-adapter' -- auth.ts
          git grep -q 'https://api.resend.com/emails' -- lib/email/email-service.ts
          if git grep -nE "from ['\"]nodemailer|require\(['\"]nodemailer" -- ':!package.json' ':!package-lock.json'; then
            echo "Nodemailer runtime import remains in source." >&2
            exit 1
          fi

      - name: Refresh vulnerable dependency graph
        if: steps.state.outputs.safe != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete p.dependencies.nodemailer;
          if (p.devDependencies) delete p.devDependencies['@types/nodemailer'];
          if (p.optionalDependencies) delete p.optionalDependencies.swisseph;
          p.dependencies.next = '15.5.22';
          p.dependencies['next-auth'] = '5.0.0-beta.32';
          p.dependencies['@auth/prisma-adapter'] = '2.11.3';
          p.dependencies.sharp = '0.35.3';
          p.dependencies.ws = '8.21.1';
          p.devDependencies.postcss = '8.5.23';
          p.devDependencies['eslint-config-next'] = '15.5.22';
          p.overrides = {
            nodemailer: '9.0.3',
            sharp: '$sharp',
            postcss: '$postcss'
          };
          fs.writeFileSync('package.json', `${JSON.stringify(p, null, 2)}\n`);
          NODE
          npm install
          npm audit fix --omit=dev

      - name: Reinstall exact locked graph before verification
        if: steps.state.outputs.safe != 'true'
        run: npm ci

      - name: Verify patched transitive graph
        shell: bash
        run: |
          set -euo pipefail
          npm ls next next-auth @auth/core nodemailer sharp postcss ws
          node - <<'NODE'
          const cp = require('child_process');
          const tree = JSON.parse(cp.execFileSync('npm', ['ls', '--all', '--json'], { encoding: 'utf8' }));
          const seen = [];
          function walk(name, node) {
            if (!node || typeof node !== 'object') return;
            const version = node.version;
            if (version && ['nodemailer','sharp','postcss','next','next-auth','@auth/core'].includes(name)) seen.push([name, version]);
            for (const [childName, child] of Object.entries(node.dependencies || {})) walk(childName, child);
          }
          for (const [name, node] of Object.entries(tree.dependencies || {})) walk(name, node);
          const bad = seen.filter(([name, version]) =>
            (name === 'nodemailer' && version !== '9.0.3') ||
            (name === 'sharp' && version !== '0.35.3') ||
            (name === 'postcss' && version !== '8.5.23') ||
            (name === 'next' && version !== '15.5.22') ||
            (name === 'next-auth' && version !== '5.0.0-beta.32') ||
            (name === '@auth/core' && version !== '0.41.3')
          );
          console.log('security-sensitive resolved versions:', seen);
          if (bad.length) {
            console.error('Unexpected vulnerable/old resolved versions:', bad);
            process.exit(1);
          }
          NODE

      - name: Verify production dependency security
        run: npm audit --omit=dev --audit-level=high

      - name: Verify application after dependency resolution
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/naksharix?schema=public
          JWT_SECRET: security-remediation-security-remediation-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          ASTROLOGY_PROVIDER: own_engine
          AI_ASTROLOGER_ENABLED: "false"
          AI_REPORT_GENERATOR_ENABLED: "false"
          ALLOW_AI_DIAGNOSTICS: "false"
          SUBSCRIPTIONS_ENABLED: "false"
          EMAIL_PROVIDER: disabled
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Commit remediated graph
        if: steps.state.outputs.safe != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore(deps): remediate production dependency vulnerabilities"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
