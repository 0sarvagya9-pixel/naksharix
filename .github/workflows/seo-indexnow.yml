name: NAKSHARIX SEO IndexNow discovery

# Only public guide additions/changes from the authoritative release branch.
# Do NOT schedule spammy resubmission and do NOT submit private/order/checkout URLs.
on:
  push:
    branches:
      - complete-production-polish
    paths:
      - '.github/workflows/seo-indexnow.yml'
      - 'scripts/seo/submit-indexnow.mjs'
      - 'public/ef1d79191967d8cf6d2404e50e8017c1.txt'
      - 'app/page.tsx'
      - 'app/about/**'
      - 'app/hi/about/**'
      - 'app/hi/page.tsx'
      - 'app/faq/**'
      - 'app/sitemap.ts'
      - 'lib/seo-brand.ts'
      - 'lib/seo-localization.ts'
      - 'components/schema-markup.tsx'
      - 'components/legal-policy-page.tsx'
      - 'components/seo/brand-answers.tsx'
      - 'components/home/approved-gallery-home.tsx'
      - 'public/llms.txt'
      - 'lib/blog-content.ts'
      - 'app/kumbh-mela-2027/**'
      - 'app/hi/kumbh-mela-2027/**'
      - 'app/festival-calendar/**'
      - 'app/hi/festival-calendar/**'
      - 'app/grahan-2027/**'
      - 'app/hi/grahan-2027/**'
      - 'app/puja-calendar/**'
      - 'app/panchang/**'
      - 'lib/puja/observances.ts'
      - 'lib/seo-seasonal.ts'
      - 'lib/seo-seasonal-copy.ts'
      - 'components/seo/seasonal-guides.tsx'
      - 'app/blog/**'
      - 'app/learn/page.tsx'
      - 'app/shop/**'
      - 'lib/shop/organic-discovery.ts'
      - 'components/shop/product-share-actions.tsx'
      - 'components/optional-report-next-step.tsx'
      - 'components/relevant-report-discovery.tsx'
      - 'app/reports/**'
      - 'app/tarot/page.tsx'
      - 'app/numerology/page.tsx'
      - 'app/weekly-love-horoscope/page.tsx'
      - 'app/numerology-monthly-horoscope/page.tsx'
      - 'app/free-kundli/page.tsx'
      - 'app/kundli-matching/page.tsx'
      - 'app/hi/free-kundli/page.tsx'
      - 'app/hi/kundli-milan/page.tsx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naksharix-seo-indexnow
  cancel-in-progress: true

jobs:
  notify-indexnow:
    if: github.repository == '0sarvagya9-pixel/naksharix'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate fixed public URLs and no sensitive paths
        run: node scripts/seo/submit-indexnow.mjs --validate-only
      - name: Wait for exact production release, verify ownership and notify IndexNow
        run: node scripts/seo/submit-indexnow.mjs
      - name: State what has and has not been verified
        run: |
          echo 'INDEXNOW_OUTCOME=SEE_VERIFIED_SCRIPT_LOG'
          echo 'GOOGLE_INDEXING=NOT_CERTIFIED'
          echo 'BING_INDEXING=NOT_CERTIFIED'
          echo 'REAL_ORGANIC_TRAFFIC=NOT_MEASURED'
